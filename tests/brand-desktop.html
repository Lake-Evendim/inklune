<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Inklune 桌面预览</title><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}iframe{position:absolute;inset:0;width:1280px;height:720px;border:0}</style><iframe title="实际桌面布局"></iframe><script>const p=new URLSearchParams(location.search),f=document.querySelector('iframe');f.src='/?preview-start='+encodeURIComponent(p.get('design')||'quiet')+(p.has('night')?'&night':'');f.onload=async()=>{await f.contentDocument.fonts.ready;for(const a of f.contentDocument.getAnimations())a.finish();document.body.dataset.ready='true';};</script></html>
