<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Inklune 实际手机布局</title><style>html,body{margin:0;height:720px;overflow:hidden;background:#ddd}#clip{position:absolute;top:0;left:0;width:390px;height:720px;overflow:hidden}iframe{position:absolute;border:0;width:390px;height:844px;top:0;left:0}nav{position:absolute;left:450px;top:30px;display:flex;gap:12px}button{height:44px;padding:0 20px}</style><div id="clip"><iframe title="实际 390 × 844 布局"></iframe></div><nav><button id="top">上半页</button><button id="bottom">下半页</button></nav><script>const p=new URLSearchParams(location.search),frame=document.querySelector('iframe');frame.src='/?preview-start='+encodeURIComponent(p.get('design')||'quiet')+(p.has('night')?'&night':'');frame.onload=async()=>{await frame.contentDocument.fonts.ready;for(const a of frame.contentDocument.getAnimations())a.finish();document.body.dataset.ready='true';};document.querySelector('#top').onclick=()=>frame.style.top='0px';document.querySelector('#bottom').onclick=()=>frame.style.top='-124px';</script></html>
